<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyer Template</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        /* Main flyer container */
        .flyer {
            width: 8.5in;
            height: 11in;
            background: linear-gradient(135deg, #ff7a00, #ff4500);
            padding: 40px;
            border-radius: 15px;
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            font-family: 'Roboto', sans-serif;

        }

        /* Header section */
        .header {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff4500, #ff7a00);
            -webkit-background-clip: text;
            color: white;
        }

        /* Product section styling */
        .product-section {
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
            padding: 20px;
            color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .product-section h2 {
            font-size: 28px;
            color: #ff4500;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .product-section img {
            width: 100%;
            max-width: 500px;
            /* Limit the width of the images */
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin: 0 auto;
            /* Center the images */
            display: block;
        }

        .product-section img:hover {
            transform: scale(1.05);
        }

        .product-section p {
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        /* Call to action button */
        .cta-btn {
            display: inline-block;
            background-color: #ff4500;
            color: white;
            padding: 15px 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.3);
        }

        .cta-btn:hover {
            background-color: #e03e00;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 69, 0, 0.5);
        }

        /* Responsive styling */
        @media (max-width: 768px) {
            .flyer {
                padding: 20px;
            }

            .header {
                font-size: 32px;
            }

            .product-section h2 {
                font-size: 24px;
            }

            .cta-btn {
                padding: 12px 20px;
                font-size: 16px;
            }

            /* Adjust the image size on mobile */
            .product-section img {
                max-width: 90%;
                /* Limit image size on small screens */
            }
        }
    </style>
</head>

<body>
    <div class="flyer">
        <div class="header">
            <h1>Exclusive Deals on Electronics!</h1>
        </div>

        <div class="product-section">
            <h2>Laptops</h2>
            <img src="https://cdn.thewirecutter.com/wp-content/media/2023/06/bestlaptops-2048px-9765.jpg?auto=webp&quality=75&width=1024"
                alt="Laptop">
            <p>Get up to 20% off on premium laptops.</p>
            <a href="shop.html" class="cta-btn">Shop Now</a>
        </div>

        <div class="product-section">
            <h2>Smartphones</h2>
            <img src="https://www.itnewsafrica.com/wp-content/uploads/2020/03/1474456-wallpaper-for-smartphone-1920x1080-screen.jpg"
                alt="Phone">
            <p>Latest 5G smartphones at amazing prices!</p>
            <a href="shop.html" class="cta-btn">Shop Now</a>
        </div>
    </div>
</body>

</html>
